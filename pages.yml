name: Sync MySQL snapshot and deploy Pages

on:
  push:
    paths:
      - index.html
      - app.js
      - styles.css
      - .github/workflows/pages.yml
      - scripts/build_pages.py
  schedule:
    # 08:49, 18:49 and 20:49 in China, after the original publisher.
    - cron: '49 0,10,12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Build static site from the published MySQL snapshot
        run: python3 scripts/build_pages.py --output-dir _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
